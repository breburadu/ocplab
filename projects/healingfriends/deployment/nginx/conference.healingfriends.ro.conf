# Review PHP-FPM socket and TLS certificate paths before enabling.
# Replace YOUR_PHP_FPM_SOCKET and use your existing ACME / TLS provisioning.
server {
    listen 80;
    server_name conference.healingfriends.ro;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name conference.healingfriends.ro;
    root /var/www/healingfriends/conference/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/conference.healingfriends.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/conference.healingfriends.ro/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/(?:index|register)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:YOUR_PHP_FPM_SOCKET;
    }
    location ~ \.php$ { return 404; }
    location ~ ^/(?:email\.txt|registrants\.txt|ip_log\.txt|composer\.(?:json|lock)|\.env(?:\..*)?|vendor/|storage/) { return 404; }
    location ~ /\. { deny all; }
    location ~* \.(?:txt|jpg|jpeg|png|webp|css|js)$ { try_files $uri =404; }
}
