name: Healing Friends PHP checks
on:
  push:
    paths:
      - 'projects/healingfriends/**'
      - '.github/workflows/healingfriends-php.yml'
  pull_request:
    paths:
      - 'projects/healingfriends/**'
      - '.github/workflows/healingfriends-php.yml'
jobs:
  php-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl
          tools: composer:v2
      - name: Lint PHP
        run: |
          set -eu
          php -l projects/healingfriends/sites/conference.healingfriends.ro/public/index.php
          php -l projects/healingfriends/sites/conference.healingfriends.ro/public/register.php
      - name: Validate Composer metadata
        working-directory: projects/healingfriends/sites/conference.healingfriends.ro/public
        run: composer validate --no-check-publish
      - name: Install dependencies
        working-directory: projects/healingfriends/sites/conference.healingfriends.ro/public
        run: composer install --no-dev --prefer-dist --no-interaction
      - name: Check shell preflight syntax
        run: sh -n projects/healingfriends/install-scripts/conference/preflight.sh
