name: Dialcube PHP checks
on:
  push:
    paths:
      - 'dialcube.ro/**'
      - '.github/workflows/dialcube-ci.yml'
  pull_request:
    paths:
      - 'dialcube.ro/**'
      - '.github/workflows/dialcube-ci.yml'
jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_password_only
          MARIADB_DATABASE: dialcube_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, fileinfo, openssl
          tools: composer:v2
          coverage: none
      - name: Validate PHP and shell
        run: |
          find dialcube.ro/httpdocs -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
          php -l dialcube.ro/scripts/create_admin.php
          bash -n dialcube.ro/scripts/deploy.sh
      - name: Install PHP dependencies
        run: cd dialcube.ro/httpdocs && composer install --no-dev --prefer-dist --no-interaction
      - name: Create baseline schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -u root -pci_password_only dialcube_test < dialcube.ro/database/schema.sql
      - name: Smoke website routes and session
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: ci_password_only
          DB_NAME: dialcube_test
        run: |
          php -S 127.0.0.1:8080 -t dialcube.ro/httpdocs > /tmp/dialcube-php.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; cat /tmp/dialcube-php.log' EXIT
          sleep 3
          curl --fail --show-error --silent 'http://127.0.0.1:8080/index.php?page=home' | grep -q 'Our Services'
          curl --fail --show-error --silent 'http://127.0.0.1:8080/index.php?page=contact' | grep -q 'Contact Us'
          curl --fail --show-error --silent 'http://127.0.0.1:8080/index.php?page=login' | grep -q 'Admin Login'
